name: lumis
description: "Lumis: a skin screening aid for Malaysia (final-year project, Sunway University)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  camera: ^0.12.2
  image_picker: ^1.2.4
  image: ^4.13.1
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  # redesign (Phase 6)
  shared_preferences: ^2.5.3   # light / dark choice on this phone
  flutter_map: ^8.1.1          # clinic map (OpenStreetMap tiles)
  latlong2: ^0.9.1
  pdf: ^3.11.3                 # "Share with a doctor" PDF
  printing: ^5.14.2            # opens the phone's share sheet for the PDF

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Jost (headings, wordmark) and Inter (reading text), both SIL Open Font License (see assets/fonts/OFL-*.txt).
  # Latin only: Chinese text uses the phone's own font.
  assets:
    - assets/fonts/
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-300.ttf
          weight: 300
        - asset: assets/fonts/Jost-400.ttf
          weight: 400
        - asset: assets/fonts/Jost-500.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
